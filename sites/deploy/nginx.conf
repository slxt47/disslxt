# disslxt – Produktseite und Hilfe (je ein nginx-Container, gleiche Konfiguration).
# DSGVO: keine Zugriffsprotokolle, keine Cookies, nur eigene Dateien (CSP erlaubt nichts Fremdes).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;          # hinter dem Tunnel nie auf http://…:80 umleiten
    access_log off;                 # keine IP-Adressen speichern
    log_not_found off;              # 404 nicht ins Fehlerprotokoll (enthielte die IP)
    error_log /dev/stderr crit;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # Gilt für jede Antwort (in Locations ohne eigenes add_header).
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-cache" always;   # Seiten immer frisch (ETag), Rest siehe unten

    error_page 404 /404.html;

    # Versteckte Dateien (.git, .env …) nie ausliefern
    location ~ /\. {
        return 404;
    }

    # Gemeinsame Dateien beider Seiten (Stylesheet, Skript, Icons)
    location ^~ /_/ {                # ^~: Vorrang vor der .css/.js-Regel unten
        alias /usr/share/nginx/shared/;
        expires 1d;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ~ \.(css|js)$ {
        expires 1d;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
