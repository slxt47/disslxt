# disslxt – Produktseite (web) und Hilfe (hilfe): statische Seiten, je ein gehärteter nginx.
# Start: cd ~/disslxt/sites && docker compose up -d
# Öffentlich nur über den Cloudflare-Tunnel (Public Hostnames → http://localhost:8092 bzw. :8093).
name: disslxt-sites

x-nginx: &nginx
  image: nginx:1.31.8-alpine@sha256:1ef7ca94d7879df82421428ce13bd1eaa412404953859cf7a5b6512c25e67a60   # feste Version
  restart: unless-stopped
  network_mode: bridge              # keine freien Docker-Netze mehr – Standard-Bridge reicht
  read_only: true
  tmpfs: [/var/cache/nginx, /var/run, /tmp]
  cap_drop: [ALL]
  cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
  security_opt: [no-new-privileges:true]
  logging: { driver: json-file, options: { max-size: 1m, max-file: "2" } }
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
    interval: 60s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  web:
    <<: *nginx
    container_name: disslxt-web
    ports: ["127.0.0.1:8092:80"]
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./shared:/usr/share/nginx/shared:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  hilfe:
    <<: *nginx
    container_name: disslxt-hilfe
    ports: ["127.0.0.1:8093:80"]
    volumes:
      - ./hilfe:/usr/share/nginx/html:ro
      - ./shared:/usr/share/nginx/shared:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
