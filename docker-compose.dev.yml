# Optional: a dev database in Docker on host port ${DEV_DB_PORT:-5433}
# (use this instead of a local PostgreSQL; 5432 is left free for the host's PG).
# Usage: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-chat}
      POSTGRES_DB: chat_mvp_dev
    ports:
      - '${DEV_DB_PORT:-5433}:5432'
    volumes:
      - dev_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chat -d chat_mvp_dev']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dev_db_data:
