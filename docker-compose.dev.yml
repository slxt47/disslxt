# Optional: a dev database in Docker on host port ${DEV_DB_PORT:-5433}
# (use this instead of a local PostgreSQL; 5432 is left free for the host's PG).
# Usage: docker compose -f docker-compose.dev.yml up -d
# Own project name so it never shares containers with the production stack in the same folder.
name: disslxt-dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-chat}
      POSTGRES_DB: disslxt_dev
    ports:
      - '127.0.0.1:${DEV_DB_PORT:-5433}:5432'
    volumes:
      - dev_db_data:/var/lib/postgresql/data
    # Hardening: no privilege escalation (the entrypoint drops to the postgres user itself)
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chat -d disslxt_dev']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dev_db_data:
