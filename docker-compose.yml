# Production-like stack: PostgreSQL + backend + Caddy (HTTPS via `tls internal`).
# Usage: cp .env.example .env && docker compose up --build -d
# The db port is intentionally NOT published (the host may already run PostgreSQL on 5432).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-chat_mvp}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-chat}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-chat_mvp}
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      COOKIE_SECURE: 'true'
      TRUST_PROXY: 'true'
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      ALLOWED_ORIGINS: https://${SITE_ADDRESS:-localhost}:${HTTPS_PORT:-8443}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-10}
      RATE_LIMIT_LOGIN_WINDOW_MS: ${RATE_LIMIT_LOGIN_WINDOW_MS:-60000}
      RATE_LIMIT_MESSAGE_MAX: ${RATE_LIMIT_MESSAGE_MAX:-20}
      RATE_LIMIT_MESSAGE_WINDOW_MS: ${RATE_LIMIT_MESSAGE_WINDOW_MS:-10000}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - '${HTTPS_PORT:-8443}:443'
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  db_data:
  caddy_data:
  caddy_config:
